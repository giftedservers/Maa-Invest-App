name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Gradle project root
        id: locate
        run: |
          MATCH=$(find . -maxdepth 4 -name 'settings.gradle.kts' -not -path '*/build/*' | head -n1)
          if [ -z "$MATCH" ]; then
            echo "ERROR: No settings.gradle.kts found anywhere under the repo (searched 4 levels deep)."
            echo "Check that the Android project files were actually committed to this repo."
            exit 1
          fi
          DIR=$(dirname "$MATCH")
          echo "Found Gradle project at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" ./maa-invest-app.apk

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maa-invest-app
          path: maa-invest-app.apk

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MAA Invest Android build ${{ github.run_number }}
          files: ./maa-invest-app.apk
          body: |
            Automatic Android build from commit ${{ github.sha }}.
            Download maa-invest-app.apk below and drop it into your
            website's downloads/ folder for the QR-code install flow.
