name: Build Android app

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (Run workflow button).
#
# This builds entirely on GitHub's own servers — no Expo account, no
# token, nothing to sign up for. GitHub's ubuntu runners already have the
# Android SDK and Java installed, so this just turns the React Native
# project into a plain Android project (expo prebuild) and builds it
# with Gradle, same as any native Android app.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      # expo prebuild doesn't reliably pin a modern enough Android Gradle
      # Plugin / Gradle pairing on a plain CI runner, which causes a
      # "Could not get unknown property 'release'" failure in
      # expo-modules-core. Force known-good versions here instead of
      # trusting whatever prebuild picked.
      - name: Pin Android Gradle Plugin and Gradle versions
        run: |
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.4/" android/build.gradle
          sed -i "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-8.6-all.zip#" android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./maa-invest-app.apk

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maa-invest-app
          path: maa-invest-app.apk

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MAA Invest Android build ${{ github.run_number }}
          files: ./maa-invest-app.apk
          body: |
            Automatic Android build from commit ${{ github.sha }}.
            Download maa-invest-app.apk below and drop it into your
            website's downloads/ folder for the QR-code install flow.
