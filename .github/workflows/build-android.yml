name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align Expo package versions
        run: npx expo install --fix

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      # Android Gradle Plugin 8.x stopped auto-creating the "release"
      # publishing component that some Expo native modules still assume
      # exists, causing "Could not get unknown property 'release'".
      # Explicitly declare it for every Android library module instead
      # of guessing at AGP/Gradle version numbers.
      - name: Patch missing publishing component
        run: |
          cat >> android/build.gradle << 'PATCH'

          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.library')) {
                      project.android {
                          publishing {
                              singleVariant('release')
                          }
                      }
                  }
              }
          }
          PATCH

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./maa-invest-app.apk

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maa-invest-app
          path: maa-invest-app.apk

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MAA Invest Android build ${{ github.run_number }}
          files: ./maa-invest-app.apk
          body: |
            Automatic Android build from commit ${{ github.sha }}.
            Download maa-invest-app.apk below and drop it into your
            website's downloads/ folder for the QR-code install flow.
